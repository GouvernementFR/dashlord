      #     output: scans/stats.json
      #     minExpectedRegex: ^stat
      #     exactExpectedRegex: ^stats$

      - uses: Quentium-Forks/dashlord-actions/save@main
        with:
          url: ${{ matrix.sites.url }}
          # only clean up previous stats when all tools ran
          cleanup: ${{ inputs.tool == 'all' && true || false }}

      - name: Commit and push
        id: commit
        continue-on-error: true
        run: |
          set -euo pipefail
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub"
          # ensure results is in sparse-checkout (no-op if not using sparse)
          git sparse-checkout set results || true
          # stage results changes
          git add --sparse results || git add -A results || true
          # commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: ${{ matrix.sites.url }}" || true
          fi
          # determine branch
          BRANCH=$(git rev-parse --abbrev-ref HEAD || echo "${GITHUB_REF#refs/heads/}")
          # try push with a few retries, pulling with autostash/rebase between attempts
          for i in $(seq 1 30); do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "$BRANCH"; then
              echo "Push succeeded"
              break
            else
              echo "Push failed, retrying (attempt $i)"
              sleep $((i * 2))
            fi
          done

