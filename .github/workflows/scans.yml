      # - name: Betagouv API scan
      #   if: (inputs.tool == 'betagouv' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
      #   continue-on-error: true
