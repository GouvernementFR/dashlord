name: DashLord scans

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Single url to scan or scan all urls"
        required: false
        default: ""
      tool:
        description: "Single tool to run or use all tools"
        type: choice
        default: all
        options:
          - all
          - "404"
          # - betagouv
          # - betagouv-budget
          # - betagouv-stats
          - declaration-a11y
          - declaration-rgpd
          - dsfr
          - ecoindex
          - httpobs
          - lighthouse
          # - nmapvuln
          # - testssl
          - tracking
          # - wappalyzer
  schedule:
    - cron: "0 2 */2 * *" # every 2 days at 2AM, see https://crontab.guru

# allow only one concurrent scan action
concurrency:
  cancel-in-progress: false
  group: scans-${{ inputs.url }}

jobs:
  init:
    runs-on: ubuntu-latest
    name: Prepare
    outputs:
      sites: ${{ steps.init.outputs.sites }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: urls.txt

      - name: Write urls.txt for single site
        if: inputs.url != ''
        run: |
          echo "${{ inputs.url }}" | tr ',' '\n' | while read line; do
            HOSTNAME=$(echo "$line" | sed -e 's/[^/]*\/\/\([^@]*@\)\?\([^:/]*\).*/\2/')
            URL=https://${HOSTNAME}
            echo $URL
          done > /tmp/urls.txt

      - name: Use urls.txt for all sites
        if: inputs.url == ''
        run: |
          cp urls.txt /tmp/urls.txt

      - name: Init from text
        uses: Quentium-Forks/dashlord-actions/init-from-txt@main
        id: init
        with:
          count: 200
          txtPath: /tmp/urls.txt
  scans:
    runs-on: ubuntu-latest
    name: Scan
    needs: init
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        sites: ${{ fromJson(needs.init.outputs.sites) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          sparse-checkout: urls.txt

      - run: |
          mkdir scans

      - name: Mozilla HTTP Observatory
        if: inputs.tool == 'httpobs' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 10
        id: http
        uses: Quentium-Forks/dashlord-actions/httpobs@main
        with:
          url: ${{ matrix.sites.url }}
          output: scans/http.json

      - name: Mozilla HTTP Observatory retry
        if: steps.http.outcome=='failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: Quentium-Forks/dashlord-actions/httpobs@main
        with:
          url: ${{ matrix.sites.url }}
          output: scans/http.json

      - name: Cancel next steps if HTTP Observatory failed
        id: failed-httpobs
        run: |
          if grep -q "Attention Required! | Cloudflare" scans/http.json; then
            echo "HTTP Observatory failed because of Cloudflare, skipping next steps"
            echo "failed=true" >> $GITHUB_OUTPUT
          fi
          if grep -q "The site seems to be down." scans/http.json; then
            echo "HTTP Observatory failed because the site might be down, skipping next steps"
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      - name: DSFR
        if: (inputs.tool == 'dsfr' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: Quentium-Forks/dashlord-actions/dsfr@main
        with:
          url: ${{ matrix.sites.url }}
          output: scans/dsfr.json

      - name: Déclaration a11y
        if: (inputs.tool == 'declaration-a11y' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: Quentium-Forks/dashlord-actions/declaration-a11y@main
        with:
          url: ${{ matrix.sites.url }}
          output: scans/declaration-a11y.json

      - name: Déclaration RGPD
        if: (inputs.tool == 'declaration-rgpd' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: Quentium-Forks/dashlord-actions/declaration-rgpd@main
        with:
          url: ${{ matrix.sites.url }}
          output: scans/declaration-rgpd.json

      - name: EcoIndex
        if: (inputs.tool == 'ecoindex' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: Quentium-Forks/dashlord-actions/ecoindex@main
        with:
          url: ${{ matrix.sites.url }}
          output: scans/ecoindex.json

      - name: Detect 404
        if: (inputs.tool == '404' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: Quentium-Forks/dashlord-actions/404@main
        with:
          url: ${{ matrix.sites.url }}
          output: scans/404.json

      - name: Tracking
        if: (inputs.tool == 'tracking' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: Quentium-Forks/dashlord-actions/tracking@main
        with:
          url: ${{ matrix.sites.url }}
          output: scans/tracking.json

      - name: Lighthouse scan
        if: (inputs.tool == 'lighthouse' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: Quentium-Forks/dashlord-actions/lhci@main
        with:
          url: ${{ matrix.sites.url }}

      # - name: Wappalyzer scan
