      #     output: scans/betagouv.json

      # - name: Budget page
      #   if: (inputs.tool == 'betagouv-budget' || inputs.tool == 'all' || github.event_name != 'workflow_dispatch') && steps.failed-httpobs.outputs.failed != 'true'
      #   continue-on-error: true
